x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doc_translator
      POSTGRES_USER: doc_translator
      POSTGRES_PASSWORD: doc_translator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_translator -d doc_translator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: .
      dockerfile: infra/docker/redis.Dockerfile
    command: redis-server --save 60 1 --loglevel warning --protected-mode no --bind 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: doc-translator-backend:latest
    build: *backend-build
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+psycopg://doc_translator:doc_translator@postgres:5432/doc_translator
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data/files
    command: >
      sh -c "alembic upgrade head &&
      uvicorn doc_translator.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - files_data:/data/files
      - babeldoc_cache:/root/.cache/babeldoc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: doc-translator-backend:latest
    build: *backend-build
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+psycopg://doc_translator:doc_translator@postgres:5432/doc_translator
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data/files
    command: python apps/worker/main.py
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files_data:/data/files
      - babeldoc_cache:/root/.cache/babeldoc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      API_PROXY_HOST: api
      API_PROXY_PORT: 8000
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  files_data:
  babeldoc_cache:
